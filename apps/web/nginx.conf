server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança. Atenção: um add_header dentro de um "location"
  # substitui TODOS os do nível de cima, por isso eles se repetem abaixo.
  # Se mudar VITE_API_URL, atualize o connect-src da CSP.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; style-src 'self'" always;

  # SPA: qualquer rota desconhecida devolve o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # arquivos com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self' data:; style-src 'self'" always;
  }
}
