<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 895" width="1340" height="895" font-family="Verdana, 'DejaVu Sans', sans-serif" role="img" aria-label="Dois casos distintos: fora do conceito (recusa com opcoes) e dentro do conceito sem base para responder (nao sei)."><rect width="1340" height="895" fill="#ffffff"/><text x="40" y="44" font-size="19" font-weight="bold" fill="#111111" text-anchor="start">Tela 5 - Pergunta fora do conceito</text><text x="40" y="68" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Dois casos distintos: fora do conceito (recusa com opcoes) e dentro do conceito sem base para responder (nao sei).</text><text x="40" y="90" font-size="10" font-weight="normal" fill="#8a8a8a" text-anchor="start">Esboco de baixa fidelidade - Etapa 3 - 07/11/2026</text><rect x="34" y="126" width="332" height="604" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.2" /><rect x="40" y="132" width="320" height="592" rx="4" fill="#fdfdfd" stroke="#555555" stroke-width="1.6" /><text x="40" y="116" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Celular</text><text x="360" y="116" font-size="11" font-weight="normal" fill="#8a8a8a" text-anchor="end">320 px</text><rect x="414" y="126" width="892" height="532" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.2" /><rect x="420" y="132" width="880" height="520" rx="4" fill="#fdfdfd" stroke="#555555" stroke-width="1.6" /><text x="420" y="116" font-size="13" font-weight="bold" fill="#111111" text-anchor="start">Desktop</text><text x="1300" y="116" font-size="11" font-weight="normal" fill="#8a8a8a" text-anchor="end">1280 px</text><rect x="40" y="132" width="320" height="34" rx="0" fill="#f6f6f6" stroke="#555555" stroke-width="1.6" /><text x="50" y="153" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">Estudos do Seu Jeito</text><rect x="306" y="139" width="44" height="20" rx="10" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="328.0" y="153.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">menu</text><rect x="132" y="184" width="212" height="44" rx="10" fill="#f6f6f6" stroke="#555555" stroke-width="1.6" /><text x="144" y="203" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">voce (digitou)</text><text x="144" y="218" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">"quem ganhou o jogo ontem?"</text><circle cx="356" cy="204" r="11" fill="#111111"/><text x="356" y="208" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><rect x="52" y="242" width="260" height="150" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2" /><text x="64" y="262" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">app</text><text x="64" y="282" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">So consigo responder sobre</text><text x="64" y="298" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">'Entrega confiavel no TCP'.</text><text x="64" y="318" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Posso continuar daqui, ou voce</text><text x="64" y="332" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">escolhe outro conceito.</text><circle cx="356" cy="290" r="11" fill="#111111"/><text x="356" y="294" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><rect x="64" y="346" width="112" height="32" rx="16" fill="#dcdcdc" stroke="#111111" stroke-width="1.6" /><text x="120.0" y="366.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Continuar este</text><rect x="184" y="346" width="116" height="32" rx="16" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="242.0" y="366.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Outro conceito</text><circle cx="356" cy="362" r="11" fill="#111111"/><text x="356" y="366" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><rect x="52" y="408" width="266" height="74" rx="10" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="64" y="428" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">app - quando nao da para verificar</text><text x="64" y="448" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Isso e sobre o TCP, mas nao esta</text><text x="64" y="462" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">no material que eu conferi.</text><text x="64" y="476" font-size="10" font-weight="normal" fill="#111111" text-anchor="start">Prefiro nao arriscar um palpite.</text><circle cx="356" cy="444" r="11" fill="#111111"/><text x="356" y="448" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="52" y="656" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">Sua pergunta sobre este conceito</text><rect x="52" y="662" width="220" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><rect x="278" y="662" width="70" height="40" rx="20" fill="#dcdcdc" stroke="#111111" stroke-width="1.6" /><text x="313.0" y="686.0" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Enviar</text><rect x="420" y="132" width="880" height="34" rx="0" fill="#f6f6f6" stroke="#555555" stroke-width="1.6" /><text x="430" y="153" font-size="11" font-weight="bold" fill="#111111" text-anchor="start">Estudos do Seu Jeito</text><rect x="980" y="138" width="51" height="22" rx="11" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="1005.5" y="153.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Estudar</text><rect x="1037" y="138" width="69" height="22" rx="11" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="1071.5" y="153.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Interesses</text><rect x="1112" y="138" width="51" height="22" rx="11" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="1137.5" y="153.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Leitura</text><rect x="1169" y="138" width="69" height="22" rx="11" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="1203.5" y="153.0" font-size="10" font-weight="normal" fill="#111111" text-anchor="middle">Meus dados</text><rect x="421" y="166" width="280" height="485" rx="0" fill="#f6f6f6" stroke="#555555" stroke-width="1.6" /><text x="438" y="192" font-size="12" font-weight="bold" fill="#111111" text-anchor="start">TCP - entrega confiavel</text><text x="438" y="228" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">O chat responde so sobre</text><text x="438" y="242" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">o conceito escolhido.</text><circle cx="692" cy="232" r="11" fill="#111111"/><text x="692" y="236" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><rect x="960" y="188" width="320" height="40" rx="10" fill="#f6f6f6" stroke="#555555" stroke-width="1.6" /><text x="972" y="205" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">voce (digitou)</text><text x="972" y="220" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">"me explica o que e DNS"</text><rect x="720" y="242" width="460" height="120" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2" /><text x="734" y="264" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">app</text><text x="734" y="286" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">So consigo responder sobre 'Entrega confiavel no TCP'.</text><text x="734" y="306" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">DNS e outro conceito. Como voce prefere seguir?</text><rect x="734" y="320" width="150" height="30" rx="15" fill="#dcdcdc" stroke="#111111" stroke-width="1.6" /><text x="809.0" y="339.0" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Continuar este</text><rect x="894" y="320" width="170" height="30" rx="15" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="979.0" y="339.0" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Escolher outro conceito</text><rect x="720" y="378" width="460" height="66" rx="10" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><text x="734" y="400" font-size="9" font-weight="bold" fill="#555555" text-anchor="start">app - quando nao da para verificar</text><text x="734" y="422" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">E sobre o TCP, mas nao esta no material conferido.</text><text x="734" y="436" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">Prefiro nao arriscar um palpite.</text><text x="720" y="584" font-size="11" font-weight="normal" fill="#555555" text-anchor="start">Sua pergunta sobre este conceito</text><rect x="720" y="590" width="420" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1.6" /><rect x="1150" y="590" width="90" height="40" rx="20" fill="#dcdcdc" stroke="#111111" stroke-width="1.6" /><text x="1195.0" y="614.0" font-size="11" font-weight="normal" fill="#111111" text-anchor="middle">Enviar</text><rect x="40" y="770" width="1260" height="81" rx="4" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.2" /><text x="52" y="787" font-size="10" font-weight="bold" fill="#555555" text-anchor="start">O QUE CADA MARCA DECIDE</text><circle cx="61" cy="804" r="11" fill="#111111"/><text x="61" y="808" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="78" y="808" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">O campo aceita qualquer texto: a recusa vem da resposta, nao do teclado [RF11, D5]</text><circle cx="701" cy="804" r="11" fill="#111111"/><text x="701" y="808" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="718" y="808" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">Recusa com educacao, dizendo o limite e nomeando o conceito atual [WCAG 3.3.1, Nielsen H9]</text><circle cx="61" cy="823" r="11" fill="#111111"/><text x="61" y="827" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="78" y="827" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">Duas saidas explicitas, nunca um beco sem saida [D5, Nielsen H3]</text><circle cx="701" cy="823" r="11" fill="#111111"/><text x="701" y="827" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="718" y="827" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">O que nao foi possivel verificar vira "nao sei", nao um palpite [RNF04, D6, achado 4: 3 de 5 perderiam a confianca]</text><circle cx="61" cy="842" r="11" fill="#111111"/><text x="61" y="846" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="78" y="846" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">O limite esta escrito na interface antes do primeiro erro: cara de chat nao promete conversa livre [Nielsen H2]</text></svg>