ext-anchor="start">Universo novo entra daqui mesmo: o aluno nao volta a tela de interesses [Rafael, cenario 2]</text><circle cx="61" cy="842" r="11" fill="#111111"/><text x="61" y="846" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="78" y="846" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">Sempre ha saida visivel; a folha fecha com Esc e devolve o foco ao botao que a abriu [WCAG 2.1.2, 2.4.3]</text><circle cx="701" cy="842" r="11" fill="#111111"/><text x="701" y="846" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text><text x="718" y="846" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">No celular e uma folha que sobe (toca a largura toda); no desktop, um dialogo centrado [RNF07]</text></svg>