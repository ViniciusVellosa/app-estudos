xt><circle cx="61" cy="804" r="11" fill="#111111"/><text x="61" y="808" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="78" y="808" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">O mesmo passo, trocado no lugar: a versao tecnica nao e outra tela nem outro assunto [RF04, D2]</text><circle cx="701" cy="804" r="11" fill="#111111"/><text x="701" y="808" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="718" y="808" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">O botao e um interruptor com aria-pressed, e o rotulo diz como voltar [Caio, WCAG 4.1.2]</text><circle cx="61" cy="823" r="11" fill="#111111"/><text x="61" y="827" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="78" y="827" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">'Proximo passo' segue do 3 para o 4: o passo atual nao se perde na troca [RF04, criterio de aceite]</text><circle cx="701" cy="823" r="11" fill="#111111"/><text x="701" y="827" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="718" y="827" font-size="11" font-weight="normal" fill="#111111" text-anchor="start">A trilha marca que o passo 3 esta em versao tecnica, com texto e nao so com cor [WCAG 1.4.1]</text></svg>